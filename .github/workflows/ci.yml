name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Nightly full 10GB engine gate (R2-7).
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: |
            server/go.sum
            pkg/go.sum
            agent/go.sum
            cli/go.sum
            restore/go.sum
            tools/golden/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Go work sync
        run: go work sync

      - name: gofmt
        run: |
          unformatted=$(gofmt -l server pkg agent cli restore tools)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Web UI typecheck + build (embed path)
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.app.json
          npm run build

      - name: Build breakwaterd
        working-directory: server
        run: |
          CGO_ENABLED=0 go build -o /tmp/breakwaterd ./cmd/breakwaterd
          /tmp/breakwaterd -version

      - name: Server unit tests (short + race)
        working-directory: server
        run: go test ./... -count=1 -short -race -timeout 10m

      - name: pkg unit tests
        working-directory: pkg
        run: go test ./... -count=1 -race -timeout 5m

      - name: agent unit tests
        working-directory: agent
        run: go test ./... -count=1 -race -timeout 5m

      - name: golden dataset unit tests (portable)
        working-directory: tools/golden
        run: go test ./... -count=1 -race -timeout 5m

      - name: kopia confinement (pkg carve-out only)
        working-directory: pkg
        run: go test ./contentid/ -count=1 -run TestKopiaConfinement -v

      - name: no sentinel magic names in data path
        run: |
          if grep -rn 'bw-object-from-contents' server/ pkg/ agent/ --include='*.go' | grep -v '_test.go'; then
            echo "sentinel name still present in non-test code"
            exit 1
          fi

      - name: Engine gate (reduced — PR/push)
        working-directory: server
        env:
          BW_GATE_BYTES: "268435456" # 256 MiB
        run: go test ./internal/vault/ -count=1 -run TestEngineGate_Kopia -timeout 15m -v

      - name: Enrollment + mTLS demo
        working-directory: server
        run: |
          go test ./internal/agentgw/ -count=1 -run 'TestM1_EnrollmentAndWrongCertRejection|TestEnroll_BodyCertMismatch' -v

      - name: M2S4 golden round-trip (portable)
        working-directory: server
        run: |
          go test ./internal/agentgw/ -count=1 -run 'Golden|TestM2S4' -v -timeout 5m

      - name: Windows cross-compile (server)
        working-directory: server
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o /tmp/breakwaterd.exe ./cmd/breakwaterd

      - name: Windows cross-compile (agent)
        working-directory: agent
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o /tmp/breakwater-agent.exe ./cmd/breakwater-agent

      - name: Docker build
        run: docker build -f packaging/docker/Dockerfile -t breakwater:ci .

  engine-gate-full:
    name: Engine gate (10GB nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Full 10GB engine gate
        working-directory: server
        run: go test ./internal/vault/ -count=1 -run TestEngineGate_Kopia -timeout 45m -v

  windows:
    name: Windows agent + MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: |
            server/go.sum
            pkg/go.sum
            agent/go.sum
            tools/golden/go.sum

      - name: Agent tests
        working-directory: agent
        run: go test ./... -count=1 -timeout 5m

      - name: Golden tests (full Windows fixtures)
        working-directory: tools/golden
        run: go test ./... -count=1 -timeout 5m

      - name: Build agent (windows/amd64)
        working-directory: agent
        env:
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-X main.version=0.0.1-ci" -o ../packaging/msi/out/breakwater-agent.exe ./cmd/breakwater-agent
          ../packaging/msi/out/breakwater-agent.exe --version

      - name: Setup WiX v5
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          wix --version

      - name: Build MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging/msi/out | Out-Null
          ./packaging/msi/build.ps1 `
            -AgentExe (Resolve-Path packaging/msi/out/breakwater-agent.exe) `
            -Version "0.0.1" `
            -OutDir (Resolve-Path packaging/msi/out)

      - name: Upload agent + MSI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: breakwater-agent-windows
          path: |
            packaging/msi/out/breakwater-agent.exe
            packaging/msi/out/breakwater-agent.msi
            packaging/msi/out/breakwater-agent.msi.sha256
          if-no-files-found: error
