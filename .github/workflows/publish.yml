name: Publish container

# Publishes the breakwaterd server image to GHCR so deployments (TrueNAS, etc.)
# can pull instead of building locally.
#
# Tags produced:
#   ghcr.io/<owner>/breakwater:main          — moving tag for the default branch
#   ghcr.io/<owner>/breakwater:sha-<short>   — immutable, use this to pin
#   ghcr.io/<owner>/breakwater:vX.Y.Z        — on version tags
#   ghcr.io/<owner>/breakwater:latest        — on version tags only
#
# NOTE: pre-v0.1.0 there is no stable release; `:main` is the working tag.
# Package visibility defaults to PRIVATE. Either make it public in the repo's
# Packages settings, or `docker login ghcr.io` on the deployment host.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build & push breakwaterd image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/breakwater
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # linux/amd64 only: TrueNAS SCALE and the target fleet are x86_64, and
      # arm64 under QEMU emulation roughly triples build time. Add
      # linux/arm64 here if an arm deployment target ever appears.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report pushed tags
        env:
          # Via env rather than direct ${{ }} interpolation in run: — tag values
          # derive from the git ref, so treat them as untrusted input.
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "Pushed:"
          printf '%s\n' "$TAGS"
